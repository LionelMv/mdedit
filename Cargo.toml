[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
mdedit-buffer = { path = "crates/buffer" }
mdedit-syntax = { path = "crates/syntax" }
mdedit-highlight = { path = "crates/highlight" }
mdedit-style = { path = "crates/style" }
mdedit-editor = { path = "crates/editor" }
mdedit-workspace = { path = "crates/workspace" }
mdedit-export = { path = "crates/export" }

egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui_extras = { version = "0.37", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ropey = "1.6"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13"
regex = "1"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control", "image-data"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
directories = "6"
ammonia = "4"
open = "5"
log = "0.4"
env_logger = "0.11"
tempfile = "3"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
